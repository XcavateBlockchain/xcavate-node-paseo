[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
authors = ["Xcavate"]
license = "GPL-3.0-only"

# NOTE: This crate is intentionally NOT part of the workspace.

[dependencies]
# Runtime access (path dependency)
xcavate-runtime = { path = "../runtime" }

# ISMP dependencies - must match versions used in runtime
ismp = { git = "https://github.com/polytope-labs/hyperbridge", branch = "polkadot-stable2503", default-features = false, features = ["std"] }
pallet-ismp = { git = "https://github.com/polytope-labs/hyperbridge", branch = "polkadot-stable2503", default-features = false, features = ["std"] }
pallet-token-gateway = { git = "https://github.com/polytope-labs/hyperbridge", branch = "polkadot-stable2503", default-features = false, features = ["std"] }

# Substrate dependencies
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2503" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2503", default-features = false, features = ["std"] }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2503", default-features = false, features = ["std"] }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2503", default-features = false, features = ["std"] }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2503", default-features = false, features = ["std"] }
pallet-assets = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2503", default-features = false, features = ["std"] }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2503", default-features = false, features = ["std"] }

# Encoding and utilities
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive", "std"] }
hex-literal = "0.4.1"
alloy-sol-types = "0.8"
alloy-primitives = "0.8"
