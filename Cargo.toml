[workspace]
members = ["node", "runtime"]
resolver = "2"

[workspace.package]
authors = ["Xcavate"]
description = "Xcavate Parachain"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/XcavateBlockchain/xcavate-node-paseo"
homepage = "https://xcavate.io/"

[workspace.dependencies]
clap = { version = "4.5.10", features = ["derive"] }
color-print = "0.3.4"
futures = "0.3.31"
hex-literal = "0.4.1"
jsonrpsee = { version = "0.24.3", features = ["server"] }
log = { version = "0.4.22", default-features = false }
parity-scale-codec = { version = "3.6.12", default-features = false, features = [
	"derive",
	"max-encoded-len",
] }
scale-info = { version = "2.11.1", default-features = false }
serde = { version = "1.0.209", default-features = false }
serde_json = "1.0.127"
smallvec = "1.11.2"

